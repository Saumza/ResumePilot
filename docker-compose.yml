version: '5.7'

services:
  db:
    image: postgres
    restart: always
    volumes:
      - ./data/db:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=resumePilot
      - POSTGRES_USER=resumePilotDB
      - POSTGRES_PASSWORD=resumePilotDB

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - 6379:6379
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - "redis-data:/data"

volumes:
  redis-data:
